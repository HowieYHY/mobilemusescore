<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1e2a3a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PocketScore</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <script type="module" crossorigin src="./assets/index-Dy5DQuS9.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B3vCFzAS.css">
</head>
<body>
  <header class="topbar">
    <label class="btn primary" id="open-label">
      <input type="file" id="file-input" hidden>
      <span>Open score</span>
    </label>
    <div class="title" id="score-title">PocketScore</div>
    <button class="btn" id="notes-toggle" aria-pressed="false" disabled title="Write on the score"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.33-2.33a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z" fill="currentColor"/></svg><span class="label">Notes</span></button>
    <select id="view-mode" aria-label="View mode" disabled>
      <option value="page">Page view</option>
      <option value="continuous_h">Continuous (vertical)</option>
      <option value="continuous_v">Continuous (horizontal)</option>
    </select>
  </header>

  <div class="notesbar" id="notesbar" hidden>
    <div class="tools" role="radiogroup" aria-label="Note tool">
      <button class="tool on" data-tool="pen" role="radio" aria-checked="true" aria-label="Pen"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75zM20.7 7.04a1 1 0 0 0 0-1.41l-2.33-2.33a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75z" fill="currentColor"/></svg><span>Pen</span></button>
      <button class="tool" data-tool="highlighter" role="radio" aria-checked="false" aria-label="Highlighter"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6 14l3 3v4h6v-4l3-3V9H6zM11 2h2v3h-2zM4.2 4.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 5.3l2.1-2.1 1.4 1.4-2.1 2.1z" fill="currentColor"/></svg><span>Highlight</span></button>
      <button class="tool" data-tool="text" role="radio" aria-checked="false" aria-label="Text box"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M5 4v3h5.5v12h3V7H19V4z" fill="currentColor"/></svg><span>Text</span></button>
      <button class="tool" data-tool="eraser" role="radio" aria-checked="false" aria-label="Eraser"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M16.24 3.56l4.95 4.94a1.5 1.5 0 0 1 0 2.12L12 19.8h7v2H8.5l-4.69-4.69a1.5 1.5 0 0 1 0-2.12l10.31-10.3a1.5 1.5 0 0 1 2.12 0zM6.64 13.6L4.93 15.3l3.98 3.98h.92l2.64-2.64z" fill="currentColor"/></svg><span>Erase</span></button>
    </div>
    <div class="swatches" id="swatches" aria-label="Colour"></div>
    <button class="btn small" id="notes-undo" disabled>Undo</button>
    <button class="btn small" id="notes-clear">Clear</button>
    <button class="btn small primary" id="notes-done">Done</button>
    <div class="hint" id="notes-hint"></div>
  </div>

  <div class="status" id="status" hidden></div>

  <main class="viewer" id="viewer">
    <div class="empty" id="empty">
      <p><strong>Open a MuseScore file (.mscz)</strong> to view and play it.</p>
      <p class="hint">Scores are laid out and played by MuseScore's own engine with the MS Basic sounds. Everything runs on this device.</p>
      <p class="hint" id="version"></p>
    </div>
    <div class="pages" id="pages"></div>
  </main>

  <div class="zoom">
    <button class="btn round" id="zoom-out" aria-label="Zoom out">−</button>
    <span id="zoom-label">100%</span>
    <button class="btn round" id="zoom-in" aria-label="Zoom in">+</button>
  </div>

  <section class="mixer" id="mixer" hidden>
    <div class="mixer-head">
      <strong>Mixer</strong>
      <button class="btn" id="mixer-close">Done</button>
    </div>
    <div class="mixer-body" id="mixer-body"></div>
    <div class="diag" id="diag"></div>
  </section>

  <footer class="transport">
    <button class="btn round" id="rewind" aria-label="Back to start" disabled><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg></button>
    <button class="btn round big" id="play" aria-label="Play" disabled><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg></button>
    <div class="timeline">
      <input type="range" id="seek" min="0" max="1000" value="0" step="1" disabled aria-label="Position">
      <div class="times"><span id="time">0:00</span><span id="bar"></span><span id="duration">0:00</span></div>
    </div>
    <button class="btn" id="mixer-toggle" disabled>Mixer</button>
  </footer>

</body>
</html>
